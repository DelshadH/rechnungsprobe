[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rechnungsprobe"
version = "0.1.0a1"
description = "Validity-preserving compatibility testing for XRechnung importers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Rechnungsprobe contributors" }]
dependencies = [
  "psutil>=6.1,<8",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.16",
  "pytest>=8.4",
  "ruff>=0.12",
  "types-psutil>=7.0",
]

[project.scripts]
rechnungsprobe = "rechnungsprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rechnungsprobe"]

[tool.hatch.build.targets.wheel.force-include]
third_party = "rechnungsprobe/third_party"
schemas = "rechnungsprobe/schemas"

[tool.hatch.build.targets.sdist]
include = [
  "/.secrets.baseline",
  "/.github",
  "/docs",
  "/research/importers",
  "/research/evidence/corpus-gate.json",
  "/research/results.json",
  "/requirements",
  "/schemas",
  "/src",
  "/tests",
  "/third_party",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rechnungsprobe"]
